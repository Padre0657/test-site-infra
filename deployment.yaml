apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-site
  namespace: test-site
  labels:
    app: test-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-site
  template:
    metadata:
      labels:
        app: test-site
    spec:
      containers:
        - name: test-site
          image: europe-west1-docker.pkg.dev/labo-quentin/apps/test-site:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
